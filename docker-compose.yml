version: "3.9"

# ── NexusGraph AI — Docker Compose ───────────────────────────────────────────
# Starts all services: Neo4j + ChromaDB + Backend API + Frontend UI
#
# Usage:
#   docker-compose up --build       # First run
#   docker-compose up               # Subsequent runs
#   docker-compose down -v          # Tear down + remove volumes

services:

  # ── Neo4j Graph Database ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: nexusgraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/nexusgraph123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "nexusgraph123", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - nexusgraph-net

  # ── ChromaDB Vector Store ─────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: nexusgraph-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"   # ChromaDB API (http://localhost:8001)
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexusgraph-net

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusgraph-backend
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nexusgraph123
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"   # FastAPI (http://localhost:8000/docs)
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - nexusgraph-net
    restart: unless-stopped

  # ── Streamlit Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusgraph-frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"   # Streamlit (http://localhost:8501)
    depends_on:
      - backend
    networks:
      - nexusgraph-net
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  neo4j_data:
    name: nexusgraph_neo4j_data
  neo4j_logs:
    name: nexusgraph_neo4j_logs
  chroma_data:
    name: nexusgraph_chroma_data

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  nexusgraph-net:
    name: nexusgraph-network
    driver: bridge
